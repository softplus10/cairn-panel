[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-panel"
version = "0.1.0"
description = "A quiet X11 status bar and quick settings for OpenBSD cwm"
requires-python = ">=3.10"
license = {text = "ISC"}
dependencies = []

[project.scripts]
cairn = "cwm_panel.app:main"

[tool.setuptools.packages.find]
include = ["cwm_panel*"]
